<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/png" href="/brand/favicon-48.png" />
    <link rel="apple-touch-icon" href="/brand/icone-192.png" />
    <title>SmartStock AI · Dorémi Brinquedos</title>
    <script>
      // Aplica o tema antes da primeira pintura, evitando "piscar" claro/escuro.
      try {
        var saved = localStorage.getItem('smartstock.theme')
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
